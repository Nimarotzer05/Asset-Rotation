# Versuchsregister (docs/REVIEW_ALLOKATOR.md; ADR 056): every model or rule variant whose performance was ever
# computed on the overlapping history, in the order they were run. The deflated Sharpe (Bailey/López de Prado 2014)
# takes N = the number of entries and V = the variance of the *same statistic* across the entries that have a
# stored return series: the appraisal ratio – Sharpe of the variant's excess return net of its full-sample beta to
# the baseline's excess return (rotationlab.forecast.evaluation.appraisal_residual), monthly. A raw difference
# "variant − baseline" would count a higher level of risk as skill (ADR 056).
# A new variant is entered here BEFORE it runs. Entries without a stored series still count in N; runs that were
# computed and seen (a first version later corrected, a reviewer's sensitivities) count too – conservative.
# Dry runs on synthetic data (ADR 058 j) are not trials: they touch no real history and inform no choice on it.
