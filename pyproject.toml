[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "rotationlab"
version = "0.1.0"
description = "Cross-asset rotation system: point-in-time data, pure features, pluggable strategies, one engine for backtest and live, scenarios, relationships, paper-trading journal."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Nima Rotzer" }]
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "pydantic>=2.7",
  "pyyaml>=6",
  "openpyxl>=3.1",      # World Bank pink sheet (static provider)
  "xlrd>=2.0.1",        # Shiller ie_data.xls (legacy Excel)
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.35"]
analytics = ["duckdb>=1.1"]   # ad-hoc SQL on the store files (AS_OF_SQL); not needed by the system
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "mypy>=1.10",
  "pandas-stubs",
  "types-PyYAML",
  "xlwt>=1.3",          # only to regenerate tests/fixtures/shiller_ie_data.xls
]

[project.scripts]
rotationlab = "rotationlab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["rotationlab"]

# --------------------------------------------------------------------------
# Lint / Format
# --------------------------------------------------------------------------
[tool.ruff]
line-length = 110
target-version = "py312"
src = ["."]
extend-exclude = ["research", "data", "output", "scripts", "src", "config.py", "run.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "PL", "RUF", "T20"]
# RUF001-003: German prose uses typographic dashes and minus signs on purpose
ignore = ["PLR0913", "PLR0917", "PLR2004", "E501", "RUF001", "RUF002", "RUF003"]   # PLR0917 like PLR0913: domain functions take many inputs

[tool.ruff.lint.isort]
known-first-party = ["rotationlab", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR", "T20", "N806", "PLC0415"]       # D for a date reads like the papers; local imports in tests
"rotationlab/cli.py" = ["T20", "PLC0415"]            # commands import their layer lazily: `validate` stays fast
"rotationlab/core/errors.py" = ["N818"]              # RiskHalt is a state, not an error message

# --------------------------------------------------------------------------
# Types: strict where the guarantees live
# --------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["rotationlab.core.*", "rotationlab.data.*", "rotationlab.portfolio.*", "rotationlab.engine.*"]
strict = true

# --------------------------------------------------------------------------
# Tests
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -m 'not network and not sweep'"
markers = [
  "golden: reproduces research figures on the frozen long-history panel (store parity)",
  "sweep: engine truncation sweep over fifty years (~10 min; weekly in the network workflow)",
  "lookahead: generic future-mutation harness over registered features and strategies",
  "integration: end-to-end on fixtures",
  "network: talks to Yahoo, Stooq, FRED, French, CFTC (weekly CI job; ALFRED checks need FRED_API_KEY)",
  "data: needs data/raw",
  "slow: > 10 s",
]
filterwarnings = [
  "error::DeprecationWarning",
  "error::FutureWarning",
  "error::pandas.errors.PerformanceWarning",
  "error::ResourceWarning",
]

[tool.coverage.run]
source = ["rotationlab"]
omit = ["rotationlab/reporting/dashboard.py"]

[tool.coverage.report]
fail_under = 85

[tool.uv]
# CI installs exactly the versions the suite was verified with; raise deliberately, never implicitly
constraint-dependencies = ["pandas==3.0.5", "numpy==2.5.3"]
