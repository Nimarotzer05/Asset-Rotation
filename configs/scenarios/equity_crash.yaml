id: equity_crash
description: Equity drawdown of 15 % or more, peak to trough, with risk-off side effects.
horizon_months: 12
analog:
  rule: equity_drawdown
  threshold: -0.15
  measure: peak_to_trough
factor_shock:
  equity: -0.30
  d_log_usd: 0.05
  d_credit_spread: 1.5
  d_log_vix: 0.8
  d_real_yield: -0.5
bootstrap:
  block_months: 6
  draws: 5000
  regime_filter: { risk_appetite_quintile: [1] }
