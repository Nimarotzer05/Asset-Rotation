# Assets. `proxy_of` maps a tradable instrument to the long-history series used for golden tests
# and historical analogs. Series ids follow "<provider>:<code>[:<field>]" (catalog: configs/series.yaml).
# A role may list a chain [primary, fallback]: the view splices the fallback in only where the primary
# has no data (ratio splice for prices, value splice for yields; reported in view.provenance()).
cash: CASH
assets:
  # ---- long-history panel (not tradable, 1973–2025, from data/raw) ----
  US_EQ:        { name: US equities TR,          asset_class: equity,     instrument: index, tradable: false, cost_bps: 0, series: { total_return: "static:usmkt:TR" } }
  UST10:        { name: 10y Treasury TR (synth), asset_class: bond,       instrument: index, tradable: false, cost_bps: 0, series: { total_return: "static:UST10" } }
  UST10_ME:     { name: 10y Treasury TR (par bond on month-end DGS10), asset_class: bond, instrument: index, tradable: false, cost_bps: 0, series: { total_return: "static:UST10_ME" } }
