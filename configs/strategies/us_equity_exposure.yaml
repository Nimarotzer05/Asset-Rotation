id: us_equity_exposure
version: 1
role: core
cadence: monthly
universe: [SPY, CASH]
long_history_universe: [FF_MKT, FF_RF]      # research: French total market, French 1M T-bill (from 1926)
warmup_months: 13
params:
  # exposure = mean of two binary votes (trend, momentum) -> 0, 0.5 or 1; rest in T-bills
  market: SPY
  trend_window_months: 10
  momentum_months: 12            # excess return over T-bills > 0
  valuation_scaling:             # optional, off in v1: multiplies exposure by floor + (1 - floor) * ECY percentile
    enabled: false
    floor: 0.75
    min_history_months: 120
    pct_start: 1926-07-31        # percentile history starts with the French market index, as in the study (audit 2026-10-25)
  # research (output/equity/REPORT.md A1/A2, docs/AUDIT_equity_study.md): macro gates (credit spread, labour market)
  # carry no 1-month information for equities (credit t = 0.3; rising unemployment even predicts HIGHER returns, t = +3.3)
  # and mechanically dilute the trend exit; deliberately not used.
long_history_params:
  market: FF_MKT
confidence:
  kind: score_dispersion         # both votes agree -> 1, split -> floor
  floor: 0.5
  params: { votes: 2 }
# Kenneth French total market 1927-2026, 5 bp per switch (cash leg free)
golden: { sharpe_ex_cash: 0.573, ann_return: 0.099, max_drawdown: -0.411 }
golden_tolerance: { sharpe_ex_cash: 0.02, ann_return: 0.01, max_drawdown: 0.03 }
golden_run:
  start: 1926-07-31
  end: 2026-07-31
  sample: [1927-01-31, 2026-07-31]
  count_warmup: false             # research dropped months without a signal
  costs: { default_bps: 5, cash_bps: 0 }
